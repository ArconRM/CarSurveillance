services:
  server:
    image: server
    build:
      context: ./backend-dotnet
      dockerfile: CarSurveillance.Server/Dockerfile
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=CarSurveillanceDatabase;Username=carsurveillanceuser;Password=qWbYhFF6
      - WEATHER_APP_URL=${WEATHER_APP_URL}
      - WEATHER_APP_KEY=${WEATHER_APP_KEY}
      - WEATHER_LAT=${WEATHER_LAT}
      - WEATHER_LON=${WEATHER_LON}
      - ASPNETCORE_URLS=http://+:5035;
    ports:
      - "5035:5035"
    volumes:
      - ./data:/data
    depends_on:
      - db

  modelsinference:
    build:
      context: ./models-inference
      dockerfile: Dockerfile
    shm_size: '16gb'
    ports:
      - "8000:8000"
      - "8888:8888"
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - JUPYTER_TOKEN=
    volumes:
      - /mnt/d/data_2:/data
      - yolo_cache:/tmp/Ultralytics
      - paddleocr_cache:/root/.paddleocr
      - ../license-plate-detection:/app/license-plate-detection
      - models_cache:/root/.cache
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 100s

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: CarSurveillanceDatabase
      POSTGRES_USER: carsurveillanceuser
      POSTGRES_PASSWORD: qWbYhFF6
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5435:5432"

volumes:
    postgres_data:
    yolo_cache:
    paddleocr_cache:
    models_cache:
